name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Новый запуск для той же ветки отменяет предыдущий, ещё не завершённый
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Типы, сборка, миграции
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allmaz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/allmaz_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/allmaz_test
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci || npm install --no-audit --no-fund

      - name: Prisma Client и пакеты монорепо
        run: |
          npm run generate -w packages/database
          npm run build:packages

      - name: Проверка типов (API)
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Проверка типов (Web)
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Миграции применяются на чистую БД
        run: npm run migrate:deploy -w packages/database

      - name: Автотесты API (модульные и с БД)
        run: npm test

      - name: Сборка API
        run: npm run build -w apps/api

      - name: Сборка Web
        run: npm run build -w apps/web
